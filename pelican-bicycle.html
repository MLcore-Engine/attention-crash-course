<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>骑自行车的鹈鹕</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(#8ed6ff 0%, #cdefff 60%, #ffe9b8 100%);
    font-family: system-ui, sans-serif;
  }
  svg { display: block; width: 100vw; height: 100vh; }
  .cloud   { animation: drift 60s linear infinite; }
  .cloud-2 { animation: drift 90s linear infinite; }
  .ground  { animation: scroll 1.2s linear infinite; }
  .wheel-spin { animation: spin 1.2s linear infinite; transform-origin: center; transform-box: fill-box; }
  .crank   { animation: spin 2.4s linear infinite; transform-origin: center; transform-box: fill-box; }
  .leg-l   { animation: pedal 2.4s linear infinite; }
  .leg-r   { animation: pedal 2.4s linear infinite; animation-delay: -1.2s; }
  .bob     { animation: bob 0.6s ease-in-out infinite alternate; }
  .wing    { animation: flap 0.6s ease-in-out infinite alternate; transform-origin: 60% 20%; transform-box: fill-box; }
  .beak    { animation: gulp 2.4s ease-in-out infinite; transform-origin: 20% 80%; transform-box: fill-box; }
  h1 {
    position: fixed; top: 18px; left: 24px; margin: 0;
    font-size: 22px; color: #0b4a6f; text-shadow: 0 1px 0 #fff;
  }
  @keyframes spin  { to { transform: rotate(360deg); } }
  @keyframes pedal { to { transform: rotate(360deg); } }
  @keyframes bob   { to { transform: translateY(-6px); } }
  @keyframes flap  { to { transform: rotate(-14deg); } }
  @keyframes gulp  { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(1.15); } }
  @keyframes scroll{ to { transform: translateX(-160px); } }
  @keyframes drift { to { transform: translateX(-140vw); } }
</style>
</head>
<body>
<h1>🚲 骑自行车的鹈鹕</h1>
<svg viewBox="0 0 900 500" preserveAspectRatio="xMidYMid slice" aria-label="一只鹈鹕在骑自行车">
  <!-- 太阳 -->
  <circle cx="760" cy="90" r="46" fill="#ffd94a"/>
  <g stroke="#ffd94a" stroke-width="5" stroke-linecap="round">
    <line x1="760" y1="20" x2="760" y2="34"/>
    <line x1="760" y1="146" x2="760" y2="160"/>
    <line x1="690" y1="90" x2="704" y2="90"/>
    <line x1="816" y1="90" x2="830" y2="90"/>
    <line x1="712" y1="42" x2="722" y2="52"/>
    <line x1="798" y1="128" x2="808" y2="138"/>
    <line x1="808" y1="42" x2="798" y2="52"/>
    <line x1="722" y1="128" x2="712" y2="138"/>
  </g>

  <!-- 云 -->
  <g class="cloud" fill="#ffffff" opacity=".9">
    <ellipse cx="180" cy="90" rx="46" ry="26"/>
    <ellipse cx="226" cy="78" rx="34" ry="24"/>
    <ellipse cx="140" cy="100" rx="30" ry="18"/>
  </g>
  <g class="cloud cloud-2" fill="#ffffff" opacity=".7">
    <ellipse cx="480" cy="140" rx="38" ry="20"/>
    <ellipse cx="516" cy="130" rx="26" ry="18"/>
    <ellipse cx="446" cy="148" rx="24" ry="14"/>
  </g>

  <!-- 远山 -->
  <path d="M0 330 L140 220 L260 330 Z" fill="#9fd3a7"/>
  <path d="M180 330 L330 200 L470 330 Z" fill="#8cc79a"/>
  <path d="M420 330 L560 235 L700 330 Z" fill="#9fd3a7"/>

  <!-- 地面 -->
  <rect x="0" y="330" width="900" height="170" fill="#a8dda0"/>
  <g class="ground" stroke="#7cc07a" stroke-width="4" stroke-linecap="round">
    <line x1="0" y1="400" x2="160" y2="400"/>
    <line x1="240" y1="400" x2="400" y2="400"/>
    <line x1="480" y1="400" x2="640" y2="400"/>
    <line x1="720" y1="400" x2="900" y2="400"/>
    <line x1="900" y1="400" x2="1060" y2="400"/>
  </g>
  <rect x="0" y="392" width="900" height="8" fill="#6f6f6f" opacity=".35"/>

  <!-- 自行车 + 鹈鹕 -->
  <g transform="translate(450 300)">
    <!-- 后轮 -->
    <g transform="translate(-130 60)">
      <circle r="72" fill="none" stroke="#2b2b2b" stroke-width="10"/>
      <g class="wheel-spin" stroke="#8a8a8a" stroke-width="3">
        <line x1="-62" y1="0" x2="62" y2="0"/>
        <line x1="0" y1="-62" x2="0" y2="62"/>
        <line x1="-44" y1="-44" x2="44" y2="44"/>
        <line x1="-44" y1="44" x2="44" y2="-44"/>
      </g>
      <circle r="8" fill="#3a3a3a"/>
    </g>
    <!-- 前轮 -->
    <g transform="translate(130 60)">
      <circle r="72" fill="none" stroke="#2b2b2b" stroke-width="10"/>
      <g class="wheel-spin" stroke="#8a8a8a" stroke-width="3">
        <line x1="-62" y1="0" x2="62" y2="0"/>
        <line x1="0" y1="-62" x2="0" y2="62"/>
        <line x1="-44" y1="-44" x2="44" y2="44"/>
        <line x1="-44" y1="44" x2="44" y2="-44"/>
      </g>
      <circle r="8" fill="#3a3a3a"/>
    </g>

    <!-- 车架 -->
    <g stroke="#e2483d" stroke-width="11" stroke-linecap="round" fill="none">
      <path d="M-130 60 L-45 -10 L40 -10"/>
      <path d="M-45 -10 L-10 60"/>
      <path d="M-45 -10 L40 -10 L130 60"/>
      <path d="M-45 -10 L-70 -25"/>
    </g>
    <!-- 车座 -->
    <path d="M-95 -30 L-45 -30 L-40 -22 L-100 -22 Z" fill="#333"/>
    <!-- 车把 -->
    <path d="M40 -10 L70 -60 L100 -55" stroke="#3a3a3a" stroke-width="10" fill="none" stroke-linecap="round"/>
    <circle cx="100" cy="-55" r="7" fill="#333"/>
    <!-- 链条与牙盘 -->
    <circle cx="-45" cy="60" r="16" fill="none" stroke="#555" stroke-width="5"/>
    <line x1="-130" y1="60" x2="-45" y2="60" stroke="#555" stroke-width="4"/>

    <!-- 鹈鹕（骑行者） -->
    <g class="bob">
      <!-- 后腿 / 前腿 -->
      <g class="leg-l">
        <path d="M-30 30 L-45 60" stroke="#f5a623" stroke-width="9" stroke-linecap="round"/>
        <path d="M-45 60 L-52 76" stroke="#f5a623" stroke-width="7" stroke-linecap="round"/>
        <path d="M-52 76 L-70 78" stroke="#f5a623" stroke-width="6" stroke-linecap="round"/>
      </g>
      <g class="leg-r">
        <path d="M10 30 L-5 60" stroke="#f5a623" stroke-width="9" stroke-linecap="round"/>
        <path d="M-5 60 L-38 44" stroke="#f5a623" stroke-width="7" stroke-linecap="round"/>
        <path d="M-38 44 L-38 60" stroke="#f5a623" stroke-width="6" stroke-linecap="round"/>
      </g>

      <!-- 身体 -->
      <ellipse cx="-15" cy="-10" rx="72" ry="46" fill="#fdfdfd" stroke="#dfe6ea" stroke-width="3"/>
      <!-- 翅膀 -->
      <g class="wing">
        <path d="M-70 -30 Q-10 -55 45 -25 Q10 -5 -60 -8 Z" fill="#eef3f6" stroke="#cfd8dd" stroke-width="3"/>
      </g>
      <!-- 尾巴 -->
      <path d="M-82 -18 L-118 -6 L-84 4 Z" fill="#f0f0f0" stroke="#cfd8dd" stroke-width="3"/>

      <!-- 脖子 + 头 -->
      <path d="M35 -40 Q60 -80 82 -86 L96 -60 Q70 -46 52 -22 Z" fill="#fdfdfd" stroke="#dfe6ea" stroke-width="3"/>
      <circle cx="92" cy="-92" r="24" fill="#fdfdfd" stroke="#dfe6ea" stroke-width="3"/>
      <!-- 呆毛 -->
      <path d="M84 -114 Q78 -132 66 -136" stroke="#f5a623" stroke-width="5" fill="none" stroke-linecap="round"/>
      <!-- 眼睛 -->
      <circle cx="100" cy="-98" r="4.5" fill="#222"/>
      <circle cx="101.5" cy="-99.5" r="1.5" fill="#fff"/>
      <!-- 喙（含大喉囊） -->
      <g class="beak">
        <path d="M112 -96 Q160 -92 190 -70 Q160 -50 112 -62 Z" fill="#ffb347" stroke="#e09a2f" stroke-width="3"/>
        <path d="M112 -62 Q150 -40 186 -68" stroke="#e09a2f" stroke-width="3" fill="none"/>
        <path d="M114 -88 Q145 -78 172 -66" stroke="#e09a2f" stroke-width="2" fill="none" opacity=".6"/>
      </g>

      <!-- 翅膀扶把 -->
      <path d="M30 -18 Q70 -30 98 -52" stroke="#fdfdfd" stroke-width="9" fill="none" stroke-linecap="round"/>
    </g>
  </g>
</svg>
</body>
</html>
